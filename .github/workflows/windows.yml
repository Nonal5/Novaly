name: Fabriquer le .exe Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Préparer le moteur Rust
        uses: dtolnay/rust-toolchain@stable

      # --- MAGIE : MET À JOUR LA VERSION AUTOMATIQUEMENT DEPUIS LE TAG ---
      - name: 4. Extraire le numéro de version du Tag
        id: tag_version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "Version détectée : $version"

      - name: 5. Injecter la version dans les configs
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./novaly-launcher/package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('./novaly-launcher/package.json', JSON.stringify(pkg, null, 2));

            const tauri = JSON.parse(fs.readFileSync('./novaly-launcher/src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = process.env.VERSION;
            fs.writeFileSync('./novaly-launcher/src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));
          "
      # -----------------------------------------------------------------

      - name: 6. Installer les dépendances
        run: npm install
        working-directory: ./novaly-launcher

      # --- LE NOUVEAU ROBOT TAURI (COMPILE, SIGNE ET UPLOAD TOUT SEUL) ---
      - name: 7. Compiler et Publier (Robot Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: "./novaly-launcher"
          tagName: ${{ github.ref_name }}
          releaseName: "Novaly ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false