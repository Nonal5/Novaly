name: Publier Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Préparer le moteur Rust
        uses: dtolnay/rust-toolchain@stable

      # --- EXTRACTION DE VERSION (Multiplateforme) ---
      - name: 4. Extraire le numéro de version
        id: tag_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version détectée : $VERSION"

      - name: 5. Injecter la version dans les configs
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./novaly-launcher/package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('./novaly-launcher/package.json', JSON.stringify(pkg, null, 2));

            const tauri = JSON.parse(fs.readFileSync('./novaly-launcher/src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = process.env.VERSION;
            fs.writeFileSync('./novaly-launcher/src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));
          "

      - name: 6. Installer les dépendances
        run: npm install
        working-directory: ./novaly-launcher

      # --- LE ROBOT TAURI UNIFIÉ ---
      - name: 7. Compiler et Publier (Robot Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: "./novaly-launcher"
          tagName: ${{ github.ref_name }}
          releaseName: "Novaly ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true