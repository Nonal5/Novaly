    <!-- Importation de la même police que ton site principal -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f13; /* Fond sombre gaming */
            color: white;
            font-family: 'Inter', sans-serif; /* Police Inter appliquée */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffffff; /* Couleur unie blanche */
            font-weight: 800;
        }

        p {
            color: #ffffff; /* Couleur unie blanche */
            font-size: 1.2rem;
            margin-bottom: 50px;
            font-weight: 500;
        }

        /* Grille pour les gros boutons */
        .download-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 900px;
        }

        /* Style des gros boutons carrés */
        .platform-btn {
            background-color: #1c1c24;
            border: 2px solid #2a2a35;
            border-radius: 25px; /* Coins très arrondis */
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .platform-btn svg {
            width: 60px;
            height: 60px;
            fill: #ffffff; /* Logo blanc par défaut */
            margin-bottom: 15px;
            transition: transform 0.3s ease, fill 0.3s ease;
        }

        .platform-btn span {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* NOUVEAU : Effets de survol (Hover en blanc & noir) */
        .platform-btn:hover {
            background-color: #ffffff; /* Le fond devient blanc */
            border-color: #ffffff;
            color: #000000; /* Le texte devient noir */
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.15); /* Légère lueur blanche */
        }

        .platform-btn:hover svg {
            transform: scale(1.1);
            fill: #000000; /* Le logo devient noir */
        }

        /* Boutons "Bientôt disponible" pour mobile */
        .platform-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Annule l'effet blanc/noir pour les boutons non disponibles */
        .platform-btn.disabled:hover {
            background-color: #1c1c24;
            border-color: #2a2a35;
            color: #ffffff;
            transform: none;
            box-shadow: none;
        }
        .platform-btn.disabled:hover svg {
            fill: #ffffff;
            transform: none;
        }
        
        .platform-btn.disabled span::after {
            content: "\A(Bientôt)";
            white-space: pre;
            font-size: 0.8rem;
            color: #888;
        }
        /* Adaptation Mobile */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; padding: 0 15px; }
            .download-grid { gap: 15px; padding: 0 15px; }
            .platform-btn { width: 140px; height: 140px; }
            .platform-btn svg { width: 40px; height: 40px; margin-bottom: 10px; }
            .platform-btn span { font-size: 0.9rem; }
        }
    </style>
